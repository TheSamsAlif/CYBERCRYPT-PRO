<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberCrypt Pro — Multi-Layer Secure Text Encryption</title>
<style>
  :root {
    --bg-main: #212121;
    --bg-sidebar: #171717;
    --bg-composer: #303030;
    --bg-hover: #2f2f2f;
    --bg-card: #2a2a2a;
    --border: #3a3a3a;
    --text: #ececec;
    --text-muted: #a0a0a0;
    --text-faint: #6b6b6b;
    --accent: #10a37f;
    --accent-hover: #0d8c6d;
    --blue: #3b82f6;
    --danger: #ef4444;
    --radius-lg: 24px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-main);
    color: var(--text);
    display: flex;
    overflow: hidden;
  }

  /* ============ SIDEBAR ============ */
  .sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--bg-sidebar);
    display: flex;
    flex-direction: column;
    padding: 12px;
    transition: margin-left .25s ease;
  }
  .sidebar.hidden { margin-left: -260px; }
  .side-logo {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px 16px;
  }
  .side-logo .mark {
    width: 34px; height: 34px; border-radius: 10px;
    background: linear-gradient(135deg, var(--blue), #1e3a8a);
    display: grid; place-items: center;
    font-size: 16px; font-weight: 700; color: #fff;
  }
  .side-logo .name { font-weight: 600; font-size: 15px; }
  .side-logo .sub { font-size: 11px; color: var(--text-faint); }

  .new-chat-btn {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px; border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: transparent; color: var(--text);
    font-size: 14px; cursor: pointer; width: 100%;
    transition: background .15s;
  }
  .new-chat-btn:hover { background: var(--bg-hover); }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-radius: var(--radius-md);
    color: var(--text-muted); font-size: 14px;
    cursor: pointer; border: none; background: none;
    width: 100%; text-align: left; transition: background .15s, color .15s;
  }
  .nav-item:hover { background: var(--bg-hover); color: var(--text); }
  .nav-item.active { background: var(--bg-hover); color: var(--text); }

  .section-label {
    font-size: 12px; color: var(--text-faint);
    padding: 18px 14px 6px; font-weight: 600;
  }
  .recent-list { flex: 1; overflow-y: auto; }
  .recent-item {
    padding: 9px 14px; border-radius: var(--radius-md);
    font-size: 13px; color: var(--text-muted);
    cursor: pointer; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .recent-item:hover { background: var(--bg-hover); color: var(--text); }
  .recent-empty { font-size: 12px; color: var(--text-faint); padding: 4px 14px; }

  .side-footer {
    border-top: 1px solid var(--border);
    padding-top: 10px; margin-top: 10px;
    font-size: 11px; color: var(--text-faint);
    display: flex; align-items: center; gap: 8px; padding-left: 6px;
  }
  .dot-ok { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }

  /* ============ MAIN ============ */
  .main { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    background: none; border: none; color: var(--text-muted);
    font-size: 18px; cursor: pointer; padding: 6px 10px;
    border-radius: var(--radius-sm);
  }
  .icon-btn:hover { background: var(--bg-hover); color: var(--text); }
  .model-chip {
    font-size: 15px; font-weight: 600; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .model-chip .chev { color: var(--text-faint); font-size: 12px; }
  .upgrade-btn {
    background: var(--accent); color: #fff; border: none;
    padding: 8px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .upgrade-btn:hover { background: var(--accent-hover); }

  /* Conversation area */
  .chat-area {
    flex: 1; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 16px 24px;
  }
  .chat-inner { width: 100%; max-width: 768px; display: flex; flex-direction: column; gap: 22px; }

  /* Empty state */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 28px;
    text-align: center; padding-top: 60px;
  }
  .empty-state h1 { font-size: 34px; font-weight: 600; }
  .mode-hint { color: var(--text-muted); font-size: 15px; max-width: 480px; line-height: 1.5; }

  /* Messages */
  .msg { display: flex; flex-direction: column; gap: 8px; animation: fadeUp .25s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none;} }
  .msg .who { font-size: 12px; color: var(--text-faint); font-weight: 600; letter-spacing: .4px; }
  .bubble {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 18px; padding: 14px 18px;
    font-size: 14px; line-height: 1.55; word-break: break-word;
    white-space: pre-wrap;
  }
  .bubble.user { background: var(--bg-composer); }
  .layer-steps { display: flex; flex-direction: column; gap: 8px; }
  .layer-step {
    display: flex; gap: 12px; align-items: baseline;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 16px;
    animation: fadeUp .3s ease;
  }
  .layer-step .tag {
    min-width: 92px; font-size: 11px; font-weight: 700;
    color: var(--blue); letter-spacing: .5px; text-transform: uppercase;
  }
  .layer-step.final .tag { color: var(--accent); }
  .layer-step .val {
    font-family: Consolas, monospace; font-size: 13px;
    color: var(--text); word-break: break-all; white-space: pre-wrap;
  }
  .copy-mini {
    margin-left: auto; background: none; border: 1px solid var(--border);
    color: var(--text-muted); font-size: 11px; padding: 4px 10px;
    border-radius: 999px; cursor: pointer; flex-shrink: 0;
  }
  .copy-mini:hover { color: var(--text); border-color: var(--text-faint); }
  .err-bubble {
    background: rgba(239,68,68,.08); border: 1px solid rgba(239,68,68,.4);
    color: #fca5a5; border-radius: 14px; padding: 12px 16px; font-size: 13px;
  }

  /* ============ COMPOSER ============ */
  .composer-wrap { padding: 8px 16px 18px; display: flex; justify-content: center; }
  .composer {
    width: 100%; max-width: 768px;
    background: var(--bg-composer);
    border-radius: var(--radius-lg);
    padding: 14px 16px 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,.35);
  }
  .composer textarea {
    width: 100%; background: none; border: none; resize: none;
    color: var(--text); font-size: 15px; font-family: inherit;
    outline: none; min-height: 44px; max-height: 180px;
    line-height: 1.5;
  }
  .composer textarea::placeholder { color: var(--text-faint); }
  .composer-bottom {
    display: flex; align-items: center; gap: 8px; margin-top: 10px;
  }
  .key-input {
    background: var(--bg-main); border: 1px solid var(--border);
    color: var(--text); border-radius: 999px;
    padding: 7px 12px; font-size: 12px; outline: none; width: 86px;
    font-family: Consolas, monospace;
  }
  .key-input:focus { border-color: var(--text-faint); }
  .key-input.wide { width: 128px; }
  .key-label { font-size: 11px; color: var(--text-faint); margin-left: 2px; }
  .dice-btn, .send-btn {
    border: none; cursor: pointer; border-radius: 50%;
    width: 38px; height: 38px; display: grid; place-items: center;
    font-size: 16px; transition: transform .1s, background .15s;
    margin-left: auto;
  }
  .dice-btn { background: transparent; color: var(--text-muted); margin-left: 0; }
  .dice-btn:hover { background: var(--bg-hover); color: var(--text); }
  .send-btn { background: var(--accent); color: #fff; }
  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { background: var(--border); cursor: not-allowed; }
  .send-btn.dec { background: var(--blue); }
  .send-btn.dec:hover { background: #2563eb; }

  .mode-switch {
    display: flex; background: var(--bg-main);
    border: 1px solid var(--border); border-radius: 999px; padding: 3px;
  }
  .mode-switch button {
    border: none; background: none; color: var(--text-muted);
    font-size: 12px; font-weight: 600; padding: 6px 14px;
    border-radius: 999px; cursor: pointer;
  }
  .mode-switch button.on { background: var(--bg-composer); color: var(--text); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 720px) {
    .sidebar { position: fixed; z-index: 10; height: 100%; }
    .sidebar.hidden { margin-left: -260px; }
    .empty-state h1 { font-size: 26px; }
  }
</style>
</head>
<body>

<!-- ================= SIDEBAR ================= -->
<aside class="sidebar" id="sidebar">
  <div class="side-logo">
    <div class="mark">🛡</div>
    <div>
      <div class="name">CyberCrypt Pro</div>
      <div class="sub">Multi-Layer Encryption</div>
    </div>
  </div>

  <button class="new-chat-btn" onclick="newSession()">✏️ &nbsp;New Session</button>

  <button class="nav-item active" id="nav-encrypt" onclick="setMode('encrypt')">
      Encrypt</button>
  <button class="nav-item" id="nav-decrypt" onclick="setMode('decrypt')">
      Decrypt</button>
  <button class="nav-item" onclick="clearAll()">🗑 &nbsp;Clear Chat</button>

  <div class="section-label">RECENT SESSIONS</div>
  <div class="recent-list" id="recentList"></div>

  <div class="side-footer"><span class="dot-ok"></span> Offline · No data leaves this device</div>
</aside>

<!-- ================= MAIN ================= -->
<main class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" onclick="toggleSidebar()">☰</button>
      <span class="model-chip">CyberCrypt Engine v1.0 <span class="chev">▾</span></span>
    </div>
    <button class="upgrade-btn" onclick="generateKeys()">🎲 Generate Keys</button>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <h1 id="greeting">Ready when you are.</h1>
      <p class="mode-hint" id="modeHint">
        Type your message below and encrypt it through three classical
        cipher layers — Caesar, Vigenère and Random XOR.
      </p>
    </div>
    <div class="chat-inner" id="chatInner"></div>
  </div>

  <!-- Composer -->
  <div class="composer-wrap">
    <div class="composer">
      <textarea id="inputText" rows="1"
        placeholder="Type your message…"></textarea>
      <div class="composer-bottom">
        <div class="mode-switch">
          <button id="mEnc" class="on" onclick="setMode('encrypt')">Encrypt</button>
          <button id="mDec" onclick="setMode('decrypt')">Decrypt</button>
        </div>
        <span class="key-label">Shift</span>
        <input class="key-input" id="kShift" value="27" inputmode="numeric">
        <span class="key-label">Key</span>
        <input class="key-input wide" id="kKey" value="FVM6BYKS3T">
        <span class="key-label">Seed</span>
        <input class="key-input" id="kSeed" value="513439" inputmode="numeric">
        <button class="dice-btn" title="Random keys" onclick="generateKeys()">🎲</button>
        <button class="send-btn" id="sendBtn" title="Run" onclick="run()">➤</button>
      </div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let mode = 'encrypt';
let busy = false;

/* ---------- mode ---------- */
function setMode(m) {
  mode = m;
  $('mEnc').classList.toggle('on', m === 'encrypt');
  $('mDec').classList.toggle('on', m === 'decrypt');
  $('nav-encrypt').classList.toggle('active', m === 'encrypt');
  $('nav-decrypt').classList.toggle('active', m === 'decrypt');
  $('sendBtn').classList.toggle('dec', m === 'decrypt');
  $('greeting').textContent = m === 'encrypt'
    ? 'Ready when you are.' : 'Decrypt a message.';
  $('modeHint').textContent = m === 'encrypt'
    ? 'Type your message below and encrypt it through three classical cipher layers — Caesar, Vigenère and Random XOR.'
    : 'Paste the encrypted text with the exact same keys to peel off all three layers.';
}

function toggleSidebar() { $('sidebar').classList.toggle('hidden'); }
function newSession() { clearAll(); setMode('encrypt'); $('inputText').focus(); }
function clearAll() {
  $('chatInner').innerHTML = '';
  $('emptyState').style.display = 'flex';
}

/* ---------- keys ---------- */
function generateKeys() {
  $('kShift').value = Math.floor(Math.random() * 25) + 1;
  $('kKey').value = Array.from({length: 8}, () =>
    'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random() * 26)]).join('');
  $('kSeed').value = Math.floor(Math.random() * 1000000);
}

/* ---------- recents ---------- */
function loadRecents() {
  try { return JSON.parse(localStorage.getItem('cc_recents') || '[]'); }
  catch { return []; }
}
function addRecent(text, wasEncrypt) {
  const list = loadRecents();
  list.unshift({ t: text.slice(0, 46), m: wasEncrypt ? 'enc' : 'dec',
                 time: new Date().toLocaleTimeString() });
  localStorage.setItem('cc_recents', JSON.stringify(list.slice(0, 12)));
  renderRecents();
}
function renderRecents() {
  const list = loadRecents();
  const el = $('recentList');
  el.innerHTML = list.length ? '' :
    '<div class="recent-empty">No sessions yet.</div>';
  list.forEach(r => {
    const d = document.createElement('div');
    d.className = 'recent-item';
    d.textContent = (r.m === 'enc' ? '🔒 ' : '🔓 ') + r.t;
    d.onclick = () => setMode(r.m === 'enc' ? 'encrypt' : 'decrypt');
    el.appendChild(d);
  });
}
renderRecents();

/* ---------- chat rendering ---------- */
function addMessage(who, cls, text) {
  $('emptyState').style.display = 'none';
  const wrap = document.createElement('div');
  wrap.className = 'msg';
  wrap.innerHTML = `<div class="who">${who}</div>`;
  const b = document.createElement('div');
  b.className = 'bubble ' + cls;
  b.textContent = text;
  wrap.appendChild(b);
  $('chatInner').appendChild(wrap);
  scrollBottom();
  return wrap;
}
function addSteps(steps) {
  const wrap = document.createElement('div');
  wrap.className = 'msg';
  wrap.innerHTML = '<div class="who">CYBERCRYPT ENGINE</div>';
  const box = document.createElement('div');
  box.className = 'layer-steps';
  steps.forEach(([tag, val, final]) => {
    const row = document.createElement('div');
    row.className = 'layer-step' + (final ? ' final' : '');
    const t = document.createElement('span'); t.className = 'tag';
    t.textContent = tag;
    const v = document.createElement('span'); v.className = 'val';
    v.textContent = val.length > 400 ? val.slice(0, 400) + ' …' : val;
    const c = document.createElement('button');
    c.className = 'copy-mini'; c.textContent = 'Copy';
    c.onclick = () => navigator.clipboard.writeText(val);
    row.append(t, v, c);
    box.appendChild(row);
  });
  wrap.appendChild(box);
  $('chatInner').appendChild(wrap);
  scrollBottom();
}
function scrollBottom() {
  const a = $('chatArea'); a.scrollTop = a.scrollHeight;
}

/* ---------- run ---------- */
async function run() {
  if (busy) return;
  const text = $('inputText').value.trim();
  if (!text) { $('inputText').focus(); return; }
  const shift = parseInt($('kShift').value) || 0;
  const key = $('kKey').value.trim();
  const seed = parseInt($('kSeed').value) || 0;

  busy = true;
  $('sendBtn').disabled = true;

  addMessage('YOU', 'user', text);
  addRecent(text, mode === 'encrypt');
  $('inputText').value = '';
  autoGrow();

  try {
    const res = await fetch(`/api/${mode}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, shift, key, seed})
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || 'Request failed');

    if (mode === 'encrypt') {
      addSteps([
        ['Layer 1 · Caesar', data.caesar],
        ['Layer 2 · Vigenère', data.vigenere],
        ['Layer 3 · XOR', data.xor],
        ['Cipher Text', data.result, true],
      ]);
    } else {
      addSteps([
        ['Peel · XOR', data.xor],
        ['Peel · Vigenère', data.vigenere],
        ['Peel · Caesar', data.caesar],
        ['Plain Text', data.result, true],
      ]);
    }
  } catch (err) {
    const e = document.createElement('div');
    e.className = 'err-bubble';
    e.textContent = '⚠ ' + err.message;
    $('chatInner').appendChild(e);
    scrollBottom();
  } finally {
    busy = false;
    $('sendBtn').disabled = false;
  }
}

/* ---------- input ux ---------- */
function autoGrow() {
  const t = $('inputText');
  t.style.height = 'auto';
  t.style.height = Math.min(t.scrollHeight, 180) + 'px';
}
$('inputText').addEventListener('input', autoGrow);
$('inputText').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); }
});
$('inputText').focus();
</script>
</body>
</html>
